<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <!-- ⚠️ EVERY asset path below must start with "/". Routing is history-based,
       so the page can legitimately be served at /subject/chemistry — and a
       relative href like "css/styles.css" resolves against THAT, giving
       /subject/css/styles.css, which does not exist. The result was a totally
       dead page on reload: no stylesheet, no script, nothing. Root-absolute
       paths resolve the same from every route. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NCEA L3 Study Hub</title>
  <meta name="description" content="A personal NCEA Level 3 study hub, teaching notes, flashcards, practice questions, credit tracking and deadline planning." />

  <!-- Fonts: Newsreader (screen-designed editorial serif, headings only) +
       Inter (body, data, numbers) + JetBrains Mono (formulas). Body and figures
       deliberately unchanged: only display type was swapped. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- KaTeX: proper maths/chemistry typesetting (mhchem adds \ce{} for formulae) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
        integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
          integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/mhchem.min.js"
          integrity="sha384-D1seVL2iPCxAOR7fZmqQjLGKKKZ26MZ0PPfoBn8SFAowGDb4LWZxc7NeJ0zXTRDW" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/print.css" />

  <!-- Set theme before paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      try {
        // store.js persists with JSON.stringify, so the raw value is '"dark"'
        // (quotes included). Parse it, or the attribute never matches the CSS.
        var raw = localStorage.getItem('ncea.theme');
        var t = null;
        if (raw) { try { t = JSON.parse(raw); } catch (e2) { t = raw; } }
        // Keep this list in step with THEME_IDS in js/themes.js. It is duplicated
        // here on purpose: this runs before any module loads, so it cannot import.
        var known = ['light', 'dark', 'midnight', 'sandstone', 'ocean'];
        if (known.indexOf(t) === -1) {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234FA97C'/%3E%3Cstop offset='1' stop-color='%23123524'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='11' fill='url(%23g)'/%3E%3Crect x='9' y='23' width='5' height='8' rx='2.5' fill='%23B4DEC8' opacity='.75'/%3E%3Crect x='17.5' y='17' width='5' height='14' rx='2.5' fill='%23E8F3ED' opacity='.9'/%3E%3Crect x='26' y='10' width='5' height='21' rx='2.5' fill='%23fff'/%3E%3Cpath d='M8 16 Q20 4 32 9' stroke='%237CC49E' stroke-width='2' fill='none' stroke-linecap='round' opacity='.85'/%3E%3C/svg%3E" />
</head>
<body data-subject="">
  <a class="skip-link" href="#content">Skip to main content</a>
  <div class="app">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="/" data-link>
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="40" height="40" role="img">
            <defs>
              <linearGradient id="bm-g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#4FA97C"/><stop offset="1" stop-color="#123524"/>
              </linearGradient>
            </defs>
            <rect width="40" height="40" rx="11" fill="url(#bm-g)"/>
            <!-- three climbing bars: credits accumulating -->
            <rect x="9"  y="23" width="5" height="8"  rx="2.5" fill="#B4DEC8" opacity=".75"/>
            <rect x="17.5" y="17" width="5" height="14" rx="2.5" fill="#E8F3ED" opacity=".9"/>
            <rect x="26" y="10" width="5" height="21" rx="2.5" fill="#fff"/>
            <!-- arc over the top: the goal being tracked toward -->
            <path d="M8 16 Q20 4 32 9" stroke="#7CC49E" stroke-width="2" fill="none"
                  stroke-linecap="round" opacity=".85"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>Study Hub</strong>
          <span id="brand-sub">NCEA Level 3</span>
        </span>
      </a>

      <div class="nav-label">Dashboard</div>
      <nav class="nav" id="nav-top"><!-- home / flagged injected by JS --></nav>

      <div class="nav-label">Subjects</div>
      <nav class="nav" id="nav-subjects"><!-- injected by JS --></nav>

      <div class="sidebar-footer">
        <div class="sidebar-progress">
          <a class="sp-link" id="sidebar-progress" href="/progress" data-link>
            <div class="sp-label"><span>Standards reviewed</span><b id="sp-count">0 / 0</b></div>
            <div class="progress progress-mini"><span id="sp-bar" style="width:0%"></span></div>
          </a>
        </div>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Open navigation">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>

        <div class="search-wrap">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <!-- The bare "/" badge that used to sit here was a keyboard-shortcut
               hint borrowed from GitHub. The shortcut still works, but the badge
               meant nothing unless you already knew the convention, so it is a
               tooltip now instead of permanent furniture. -->
          <input type="text" class="search-input" id="search-input"
                 placeholder="Search all subjects, topics, formulas…" autocomplete="off"
                 aria-label="Search" title="Search. Tip: press / anywhere to jump here." />
          <div class="search-results" id="search-results" role="listbox"></div>
        </div>

        <div class="topbar-actions">
          <!-- Auth controls. Empty (and hidden) until js/auth/config.js has
               keys, so an unconfigured copy shows no sign of accounts. -->
          <div class="auth-actions" id="auth-actions" hidden></div>

          <div class="theme-picker" id="theme-picker">
            <button class="icon-btn" id="theme-toggle" aria-label="Change colour scheme" title="Colour scheme"
                    aria-haspopup="menu" aria-expanded="false">
              <svg class="icon-sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <div class="theme-menu" id="theme-menu" role="menu" hidden><!-- injected by JS --></div>
          </div>
        </div>
      </header>

      <main class="content" id="content" tabindex="-1">
        <!-- Views rendered here by the router -->
        <!-- FIRST PAINT ONLY: filled by the inline script below. Left empty
             here so there is never a wrong-shaped skeleton in the markup. -->
        <div class="content-inner" id="boot-skeleton" aria-busy="true"></div>
      </main>
      <script>
      /* FIRST-PAINT SKELETON. Deliberately a plain inline script, not a module:
         it has to run before anything is imported, which is exactly the gap the
         skeleton exists to fill. It mirrors the shapes in js/router.js — the
         duplication is the price of having no dependencies at this point.

         Route-aware, because a dashboard-shaped skeleton in front of the
         Progress page is worse than none: it promises the wrong layout and then
         everything moves when the real page lands. */
      (function () {
        var host = document.getElementById('boot-skeleton');
        if (!host) return;
        var p = (location.pathname || '/').split('/').filter(Boolean)[0] || '';
        var bar = function (w, h, extra) {
          return '<div class="sk" style="width:' + w + ';height:' + h + 'px;' + (extra || '') + '"></div>';
        };
        var tiles = function (n) {
          var out = '';
          for (var i = 0; i < n; i++) out += '<div class="stat-tile sk-tile-real">'
            + bar('3.2rem', 30) + bar('80%', 11) + '</div>';
          return '<div class="stat-row sk-stat-row">' + out + '</div>';
        };
        var rows = function (n, cols) {
          var out = '';
          for (var i = 0; i < n; i++) {
            var c = '';
            for (var j = 0; j < cols.length; j++) c += bar(cols[j], 13);
            out += '<div class="sk-tr">' + c + '</div>';
          }
          return out;
        };
        var card = function (inner) { return '<div class="card sk-card-real">' + inner + '</div>'; };
        var head = '<div class="sk-head">' + bar('6rem', 11) + bar('55%', 40)
                 + bar('88%', 14) + bar('64%', 14) + '</div>';
        var tabs = '<div class="sk sk-tabs"></div>';
        var crumbs = '<div class="sk sk-crumbs"></div>';

        var body;
        if (p === 'progress') {
          body = tiles(4)
            + '<div class="sk-two">'
              + card(bar('11rem', 18) + '<div class="sk sk-donut"></div>' + bar('80%', 11))
              + card(bar('4rem', 18) + bar('100%', 38) + bar('90%', 11) + bar('60%', 30))
            + '</div>'
            + card(bar('9rem', 18) + rows(8, ['19%', '32%', '8%', '15%', '10%']));
        } else if (p === 'calendar') {
          var cells = '';
          for (var i = 0; i < 42; i++) cells += '<div class="sk sk-cell"></div>';
          body = card(bar('9rem', 16) + '<div class="sk-cal-grid">' + cells + '</div>');
        } else if (p === 'internals' || p === 'exams') {
          body = tiles(4) + card(bar('8rem', 18) + rows(6, ['26%', '35%', '12%', '9%']));
        } else if (p === 'subject') {
          var g = '';
          for (var i = 0; i < 6; i++) g += card(bar('55%', 16) + bar('100%', 11) + bar('85%', 11) + bar('40%', 24));
          body = tiles(3) + '<div class="sk-grid">' + g + '</div>';
        } else if (p === 'topic') {
          var blocks = '';
          for (var i = 0; i < 3; i++) blocks += card(bar('45%', 20) + bar('100%', 14) + bar('97%', 14) + bar('88%', 14) + bar('60%', 14));
          body = '<div class="sk-topic"><div class="sk-topic-main">' + blocks + '</div>'
               + '<div class="sk-topic-rail">' + card(bar('60%', 12) + bar('90%', 11) + bar('80%', 11) + bar('85%', 11)) + '</div></div>';
        } else if (p === 'revise') {
          var chips = '';
          for (var i = 0; i < 7; i++) chips += '<div class="sk sk-chip"></div>';
          body = card(bar('10rem', 16) + '<div class="sk-chips">' + chips + '</div>'
               + bar('12rem', 40, 'margin-top:22px;border-radius:999px'));
        } else {
          /* dashboard and anything else: hero, what's coming, snapshot */
          var hstats = '';
          for (var i = 0; i < 3; i++) hstats += '<div>' + bar('3rem', 28) + bar('5rem', 10) + '</div>';
          var due = '';
          for (var i = 0; i < 4; i++) due += '<div class="due-item sk-due-item">'
            + '<span class="sk sk-dot"></span><span class="sk-due-main">'
            + bar('70%', 13) + bar('45%', 10) + '</span><span class="sk sk-pill"></span></div>';
          body = '<div class="sk-hero">' + bar('50%', 34) + bar('70%', 13)
               + '<div class="sk-hero-stats">' + hstats + '</div>'
               + bar('12rem', 42, 'border-radius:999px;margin-top:20px') + '</div>'
               + card(bar('9rem', 18) + '<div class="due-list sk-due">' + due + '</div>')
               + card(bar('7rem', 16) + rows(3, ['26%', '42%', '14%']));
        }

        var TABBED = { internals: 1, calendar: 1, exams: 1 };
        var CRUMBED = { subject: 1, topic: 1, reference: 1 };
        var furniture = (p === '' || p === 'flagged') ? ''
          : (TABBED[p] ? tabs : CRUMBED[p] ? crumbs : '')
            + (p === 'topic' ? '<div class="sk-head sk-head-tall">' + bar('6rem', 11)
                 + bar('60%', 40) + bar('90%', 14) + bar('75%', 14) + bar('50%', 14)
                 + '</div><div class="sk sk-toolbar"></div>'
               : head);

        host.className = 'content-inner sk-wrap';
        host.innerHTML = '<span class="sr-only">Loading</span>' + furniture
                       + '<div class="sk-body">' + body + '</div>';
      })();
      </script>
    </div>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <div class="toast" id="toast"></div>

  <!-- App entry point (ES modules) -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
